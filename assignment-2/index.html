<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Internship Application Form">
    <meta name="author" content="Pavan priyank">
    <title>The Ultimate Form</title>
</head>
<body>

    <h1>Application Form</h1>
    <p>Student Internship application &middot; * Required</p>

    <form action="#" method="POST" enctype="multipart/form-data">

        <!-- Section 1: Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <!-- Full Name -->
            <label for="fullname">Full name *</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Pavan priyank" required minlength="3"><br><br>

            <!-- Email -->
            <label for="email">Email *</label><br>
            <input type="email" id="email" name="email" placeholder="pavankatiha@gmail.com" required><br><br>

            <!-- Password -->
            <label for="password">Password *</label><br>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6"><br><br>

            <!-- Phone -->
            <label for="phone">Phone *</label><br>
            <input type="tel" id="phone" name="phone" placeholder="6397691876" required pattern="[0-9]{10}"><br><br>

            <!-- Portfolio URL -->
            <label for="portfolio">Portfolio URL</label><br>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com"><br><br>

            <!-- Age -->
            <label for="age">Age *</label><br>
            <input type="number" id="age" name="age" placeholder="18" required min="18" max="60"><br><br>

            <!-- Gender -->
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other" checked>
            <label for="">Other / prefer not to say</label>
        </fieldset>

        <br>

        <!-- Section 2: Education -->
        <fieldset>
            <legend>Education</legend>

            <!-- Dropdown -->
            <label for="course">Course *</label><br>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="btech-cs" selected>BTech - Computer Science</option>
                <option value="btech-it">BTech - Information Technology</option>
                <option value="bca">BCA</option>
            </select><br><br>

            <!-- Datalist -->
            <label for="city">Preferred city (datalist)</label><br>
            <input type="text" id="city" name="city" list="city-list" placeholder="Delhi">
            <datalist id="city-list">
                <option value="Delhi">
                <option value="Mumbai">
                <option value="Bengaluru">
                <option value="Pune">
                <option value="Hyderabad">
            </datalist><br><br>

            <!-- Checkboxes -->
            <label>Skills:</label>
            <input type="checkbox" id="skill-html" name="skills" value="html" checked>
            <label for="skill-html">HTML</label>
            <input type="checkbox" id="skill-css" name="skills" value="css" checked>
            <label for="skill-css">CSS</label>
            <input type="checkbox" id="skill-js" name="skills" value="js">
            <label for="skill-js">JavaScript</label>
        </fieldset>

        <br>
               <!-- Section 3: Upload & Extras -->
        <fieldset>
            <legend>Upload & Extras</legend>

            <!-- Date -->
            <label for="available-date">Available from</label><br>
            <input type="date" id="available-date" name="available_date" value="2026-11-15"><br><br>

            <!-- Time -->
            <label for="interview-time">Interview time</label><br>
            <input type="time" id="interview-time" name="interview_time" value="10:30"><br><br>

            <!-- File Upload -->
            <label for="resume">Resume *</label><br>
            <input type="file" id="resume" name="resume" required accept=".pdf,.doc,.docx"><br><br>

            <!-- Range Slider -->
            <label for="stipend">Expected monthly stipend: &#8377;10,000</label><br>
            <input type="range" id="stipend" name="stipend" min="5000" max="50000" step="1000" value="10000"><br><br>

            <!-- Color Picker -->
            <label for="favourite-color">Favourite colour:</label>
            <input type="color" id="favourite-color" name="favourite_color" value="#008080"><br><br>

            <!-- Textarea -->
            <label for="reason">Why would you like to join?</label><br>
            <textarea id="reason" name="reason" rows="4" cols="50" placeholder="I want to practise HTML and CSS on real projects."></textarea>
        </fieldset>

        <br>

        <!-- Submit & Reset Buttons -->
        <button type="submit">Submit application</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
